# Automatische Update-PRs (Issue #11). Sicherheitsupdates kommen zusätzlich sofort,
# sobald „Dependabot security updates“ in den Repository-Einstellungen aktiv ist.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: staging
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /website
    target-branch: staging
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      website-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    target-branch: staging
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /website
    target-branch: staging
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    target-branch: staging
    schedule:
      interval: weekly

  # Images in den Compose-Stacks und im Backup-Dienst (Issue #74)
  - package-ecosystem: docker-compose
    directory: /
    target-branch: staging
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /deploy/backup
    target-branch: staging
    schedule:
      interval: weekly
