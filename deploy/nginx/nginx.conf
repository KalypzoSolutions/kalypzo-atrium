# HTTPS-Terminierung vor der App (Compose-Profil "proxy"). Zertifikate unter deploy/nginx/certs/{fullchain.pem,privkey.pem}.
#
# Diese Datei ist eine VORLAGE des offiziellen nginx-Images: Compose bindet sie als
# /etc/nginx/templates/default.conf.template ein, beim Start wird ${INTERN_DOMAIN} ersetzt (nur diese Variable,
# NGINX_ENVSUBST_FILTER) und das Ergebnis nach /etc/nginx/conf.d/default.conf geschrieben.
#
# Größengrenzen je location (Issue #25), abgestimmt auf die App – Tabelle in docs/deployment.md → „Upload-Grenzen“:
#   Proxy ≥ Node (BODY_SIZE_LIMIT 110M im Dockerfile) ≥ fachliche Grenze. Kleine Grenzen für Anmeldung und JSON-API,
#   große nur für Modul-Uploads und das Hochladen von Sicherungs-Stücken.
# TLS nach Mozilla „intermediate“ (Stand 2026). OCSP-Stapling entfällt: Let's Encrypt betreibt seit 2025 kein OCSP mehr.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# Zweite Schicht vor den App-Rate-Limits: Anmeldung/Passwort-Reset je Client-IP
limit_req_zone $binary_remote_addr zone=ep_auth:10m rate=30r/m;
limit_req_status 429;

ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:EPSSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
server_tokens off;

# Kompression für HTML/JSON/CSS/JS (#20); Bilder sind schon komprimiert. Downloads/Sicherungen streamen ohnehin binär.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types application/json application/javascript text/css text/plain text/xml application/xml image/svg+xml;

# Unbekannte Hosts (IP-Scans, fremde Domains) ohne Antwort abweisen
server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;
  return 444;
}

server {
  listen 443 ssl default_server;
  listen [::]:443 ssl default_server;
  http2 on;
  server_name _;
  ssl_reject_handshake on;
}

server {
  listen 80;
  listen [::]:80;
  server_name ${INTERN_DOMAIN};
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name ${INTERN_DOMAIN};

  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;

  # Standard für Seiten und Form-Actions (Logo/Profilbild ≤ 2 MB)
  client_max_body_size 10m;
  client_body_timeout 60s;
  send_timeout 120s;

  # Gemeinsame Proxy-Einstellungen (in jeder location wiederholt, weil proxy_set_header nicht additiv erbt)
  proxy_http_version 1.1;
  proxy_read_timeout 120s;
  proxy_send_timeout 120s;

  location / {
    proxy_pass http://app:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }

  # Anmeldung, Better-Auth, Passwort-Reset: winzige Bodies, Rate-Limit
  location ~ ^/(login|forgot-password|reset-password|api/auth/) {
    client_max_body_size 64k;
    limit_req zone=ep_auth burst=30 nodelay;
    proxy_pass http://app:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
  }

  # REST-API (JSON ≤ 1 MB im Router)
  location /api/v1/ {
    client_max_body_size 2m;
    proxy_pass http://app:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
  }

  # Modul-Endpunkte inkl. Uploads (Dateien bis core.storage.maxFileSizeMb, Galerie 25 MB, öffentl. Multipart 30 MB,
  # Aktions-Import) = BODY_SIZE_LIMIT. Längere Timeouts für PDF-Listen und Exporte.
  location /api/v1/modules/ {
    client_max_body_size 110m;
    client_body_timeout 300s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_pass http://app:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
  }

  # Datensicherung: Upload in 8-MB-Stücken (UPLOAD_CHUNK_BYTES) direkt durchreichen, nicht zwischenpuffern
  location /admin/backup/import/upload {
    client_max_body_size 9m;
    proxy_request_buffering off;
    client_body_timeout 300s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_pass http://app:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
  }

  # Datensicherung: Export erzeugen (dauert) und mehrere GB streamen – ohne Zwischenpuffer/Temp-Datei in nginx
  location /admin/backup/export {
    client_max_body_size 1m;
    proxy_buffering off;
    proxy_max_temp_file_size 0;
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;
    send_timeout 1800s;
    proxy_pass http://app:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
  }
}

