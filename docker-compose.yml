# Produktivbetrieb: App + PostgreSQL. Reverse Proxy: siehe deploy/nginx/ (Profil "proxy").
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ep_intern}
      POSTGRES_USER: ${POSTGRES_USER:-ep_intern}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD muss gesetzt sein}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]
    security_opt: ['no-new-privileges:true']

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ep_intern}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ep_intern}
      APP_SECRET: ${APP_SECRET:?APP_SECRET muss gesetzt sein}
      ORIGIN: ${ORIGIN:?ORIGIN muss gesetzt sein}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      # Hinter dem Reverse Proxy: Client-IP und Protokoll aus den Proxy-Headern lesen
      ADDRESS_HEADER: X-Forwarded-For
      XFF_DEPTH: '1'
      PROTOCOL_HEADER: X-Forwarded-Proto
      HOST_HEADER: X-Forwarded-Host
    expose: ['3000']
    ports:
      - '127.0.0.1:${APP_PORT:-3000}:3000'
    networks: [internal]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']

  nginx:
    profiles: ['proxy']
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [app]
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
    networks: [internal]
    security_opt: ['no-new-privileges:true']

volumes:
  db-data:

networks:
  internal:
