# Produktivbetrieb: App + PostgreSQL. Reverse Proxy: deploy/nginx/ (Profil "proxy"),
# automatische Sicherung: Dienst `db-backup` (Profil "backup"). Profile per COMPOSE_PROFILES=proxy,backup in .env.
#
# Ressourcen (Issue #39): Standardwerte für einen kleinen Vereinsserver (ab 1 vCPU, 4 GB RAM), je Dienst per
# Variable überschreibbar (*_MEM_LIMIT, *_CPUS; `cpus` darf die Kernzahl des Hosts nicht übersteigen).
# Für 2 GB RAM bzw. größere Server: siehe docs/deployment.md → „Ressourcen und Logs“.
# Images mit fester Version + Digest (Issue #74); Updates per Dependabot.

x-logging: &logging # json-file mit Rotation: höchstens 5 × 10 MB je Container
  logging:
    driver: json-file
    options:
      max-size: '10m'
      max-file: '5'

x-hardening: &hardening
  security_opt: ['no-new-privileges:true']
  # tini als PID 1: leitet SIGTERM weiter und räumt Zombie-Prozesse (Chromium, pg_dump) ab
  init: true

services:
  db:
    <<: [*logging, *hardening]
    image: postgres:17.11-alpine3.24@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ep_intern}
      POSTGRES_USER: ${POSTGRES_USER:-ep_intern}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD muss gesetzt sein}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]
    mem_limit: ${DB_MEM_LIMIT:-1g}
    cpus: ${DB_CPUS:-1.0}
    cpu_shares: 1024
    pids_limit: 256
    shm_size: 256m
    # PostgreSQL beendet sich bei SIGINT (Image-Standard) mit „fast shutdown“; Zeit für Checkpoint lassen
    stop_grace_period: 60s

  app:
    <<: [*logging, *hardening]
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ep_intern}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ep_intern}
      APP_SECRET: ${APP_SECRET:?APP_SECRET muss gesetzt sein}
      ORIGIN: ${ORIGIN:?ORIGIN muss gesetzt sein}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      BACKUP_MAX_BYTES: ${BACKUP_MAX_BYTES:-}
      # Temp-Dateien der Datensicherung auf dem Volume `backup-tmp` statt im RAM-tmpfs /tmp (Issue #38)
      BACKUP_TMP_DIR: /var/tmp/ep-backup
      # Hinter dem Reverse Proxy: Client-IP und Protokoll aus den Proxy-Headern lesen
      ADDRESS_HEADER: X-Forwarded-For
      XFF_DEPTH: '1'
      PROTOCOL_HEADER: X-Forwarded-Proto
      HOST_HEADER: X-Forwarded-Host
    expose: ['3000']
    ports:
      - '127.0.0.1:${APP_PORT:-3000}:3000'
    networks: [internal]
    read_only: true
    volumes:
      - backup-tmp:/var/tmp/ep-backup
      # Modul-Installation im Panel: Supervisor baut im Container neu (Generationen, Quellen, Protokolle)
      - atrium-data:/data/atrium
    tmpfs:
      # klein und begrenzt: nur Chromium-Profile/kurzlebige Dateien; große Dateien → backup-tmp
      - /tmp:size=256m,mode=1777
    cap_drop: [ALL]
    # Neubau beim Installieren von Modulen braucht ~3,5 GB (Messung docs/deployment.md); ohne Installation reichen 1,5 GB
    mem_limit: ${APP_MEM_LIMIT:-4g}
    cpus: ${APP_CPUS:-1.0}
    cpu_shares: 768
    # Chromium startet viele Prozesse/Threads (pids_limit zählt Threads)
    pids_limit: 1024
    # Zeit für laufende Requests nach SIGTERM (adapter-node schließt den Server geordnet)
    stop_grace_period: 30s

  nginx:
    <<: [*logging, *hardening]
    profiles: ['proxy']
    image: nginx:1.30.6-alpine3.24@sha256:970364228b1e4f932abc22d321932816782cca8a20b85a77552a7cfe9acfb3b5
    restart: unless-stopped
    depends_on: [app]
    environment:
      # Domain des Intern-Bereichs (Pflicht für das Proxy-Profil; andere Hosts werden abgewiesen)
      INTERN_DOMAIN: ${INTERN_DOMAIN:-intern.example.org}
      # nur ${INTERN_DOMAIN} ersetzen, nginx-Variablen wie $host bleiben unberührt
      NGINX_ENVSUBST_FILTER: '^INTERN_DOMAIN$$'
    ports:
      - '80:80'
      - '443:443'
    volumes:
      # Vorlage → /etc/nginx/conf.d/default.conf (envsubst beim Start des offiziellen Images)
      - ./deploy/nginx/nginx.conf:/etc/nginx/templates/default.conf.template:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
    networks: [internal]
    mem_limit: ${NGINX_MEM_LIMIT:-128m}
    cpus: ${NGINX_CPUS:-0.5}
    pids_limit: 128
    stop_grace_period: 30s

  # Tägliche, verschlüsselte Sicherung von PostgreSQL und Objektspeicher (Issue #40), Profil "backup".
  # Pflicht: RESTIC_PASSWORD; Offsite-Ziel per RESTIC_REPOSITORY (Standard: Volume `backup-repo` auf diesem Host).
  db-backup:
    <<: [*logging, *hardening]
    profiles: ['backup']
    build: ./deploy/backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Europe/Berlin}
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-ep_intern}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-ep_intern}
      BACKUP_TIME: ${BACKUP_TIME:-02:30}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-7}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-4}
      BACKUP_KEEP_MONTHLY: ${BACKUP_KEEP_MONTHLY:-6}
      BACKUP_RUN_ON_START: ${BACKUP_RUN_ON_START:-false}
      BACKUP_HEARTBEAT_URL: ${BACKUP_HEARTBEAT_URL:-}
      BACKUP_NOTIFY_URL: ${BACKUP_NOTIFY_URL:-}
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-/backups/restic}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:-}
      BACKUP_REPO_ACCESS_KEY_ID: ${BACKUP_REPO_ACCESS_KEY_ID:-}
      BACKUP_REPO_SECRET_ACCESS_KEY: ${BACKUP_REPO_SECRET_ACCESS_KEY:-}
      BACKUP_REPO_REGION: ${BACKUP_REPO_REGION:-}
      # Objektspeicher, aus dem gesichert wird (Lesezugriff genügt); leer = nur Datenbank
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-us-east-1}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      BACKUP_S3_FORCE_PATH_STYLE: ${BACKUP_S3_FORCE_PATH_STYLE:-true}
    volumes:
      - backup-work:/work
      - backup-repo:/backups
    networks: [internal]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    mem_limit: ${BACKUP_MEM_LIMIT:-512m}
    cpus: ${BACKUP_CPUS:-0.5}
    cpu_shares: 256
    pids_limit: 256
    stop_grace_period: 60s

volumes:
  db-data:
  atrium-data:
  backup-tmp:
  backup-work:
  backup-repo:

networks:
  internal:
