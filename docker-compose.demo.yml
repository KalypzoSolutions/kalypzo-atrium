# Demo-/Testumgebung: S3-kompatibler Storage (MinIO) fuer Belege und Dokumente, Mailpit als Mail-Faenger.
# Start:  docker compose -f docker-compose.demo.yml up -d
# Danach: node scripts/setup-demo-storage.mjs   (hinterlegt die Verbindung im laufenden Demo-System)
# Hinweis: Das offizielle Image `minio/minio` wird nicht mehr auf Docker Hub veroeffentlicht;
# `bitnamilegacy/minio` ist ein eingefrorenes, funktionsfaehiges MinIO-Image fuer lokale Tests.
# Feste Versionen + Digest (Issue #74); 2025.7.23 entspricht dem bisherigen `latest`.
services:
  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5@sha256:6dabb4a2088c9a79908de3bc05f4586c23ad2182c8908e7e3acbf61c1467fb20
    environment:
      MINIO_ROOT_USER: demo-access
      MINIO_ROOT_PASSWORD: demo-secret-key-2026
      MINIO_DEFAULT_BUCKETS: ep-intern-demo
      MINIO_API_PORT_NUMBER: '9000'
      MINIO_CONSOLE_PORT_NUMBER: '9001'
    ports:
      - '127.0.0.1:9100:9000'
      - '127.0.0.1:9101:9001'
    volumes:
      - demo-minio:/bitnami/minio/data
  # Mail-Fänger: nimmt alle E-Mails an und zeigt sie unter http://localhost:8026 (nichts wird wirklich versendet)
  mailpit:
    image: axllent/mailpit:v1.31.6@sha256:23fe39e81bde596a918000b3135c0f85dc8bb4c9ea6be274b051143f3e300387
    ports:
      - '127.0.0.1:1026:1025'
      - '127.0.0.1:8026:8025'
  # IMAP-Server als Catch-all-Postfach für den Posteingang des Moduls Nachrichten (IMAP ohne TLS auf
  # 127.0.0.1:1143, jedes Passwort wird angenommen). Befüllen: node scripts/seed-demo-inbox.mjs
  greenmail:
    image: greenmail/standalone:2.1.2@sha256:572d22796908375678119a13fabfcdc5416c9003404ab975fe824692fe02ba03
    environment:
      GREENMAIL_OPTS: '-Dgreenmail.setup.test.imap -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled'
    ports:
      - '127.0.0.1:1143:3143'
volumes:
  demo-minio:
