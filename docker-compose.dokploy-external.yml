# Dokploy / Produktivbetrieb mit EXTERNEM PostgreSQL und EXTERNEM S3-Speicher: nur die App (+ optional Sicherung).
# Für zentral betriebene Dienste: eine PostgreSQL-Instanz für mehrere Stacks (je Stack eigene Datenbank + eigener Benutzer)
# und ein S3-kompatibler Dienst (Hetzner Object Storage, Cloudflare R2, Backblaze B2, AWS S3, zentraler MinIO/Garage …).
#
# Dokploy: Projekt -> "Compose" -> Provider "Git" (Repository + Branch), Compose-Pfad
#   ./docker-compose.dokploy-external.yml, Compose-Typ "Docker Compose". Variablen im Reiter "Environment"
#   setzen (Vorlage: .env.dokploy-external.example). Unter "Domains" die Domain auf Service `app`, Port 3000,
#   HTTPS (Let's Encrypt) legen. Daten liegen nur noch in der externen Datenbank und im externen Bucket;
#   im Stack bleiben `atrium-data` (Modul-Generationen) und `backup-tmp` (Temp-Dateien der Datensicherung).
#
# Datenbank vorbereiten (einmal je Stack, als Superuser der zentralen Instanz, PostgreSQL ≥ 16, empfohlen 17):
#   CREATE ROLE atrium_prod LOGIN PASSWORD '<zufällig>';
#   CREATE DATABASE atrium_prod OWNER atrium_prod;
# Die App braucht Besitz der Datenbank (legt je Modul ein Schema `mod_<id>` an). Keine Erweiterungen nötig.
# Verbindung direkt oder über PgBouncer im **Session**-Modus – nicht Transaction-Modus (Advisory-Locks der Migrationen).
#
# Erreichbarkeit der Datenbank:
#   - Von Dokploy verwaltete Datenbank: liegt im `dokploy-network`; Host = "Internal Host" aus Dokploy
#     (eindeutiger Name, z. B. zentral-postgres-abc123), Port 5432.
#   - Andere Server: Hostname/IP + `?sslmode=require` in DATABASE_URL (pg prüft dabei das Zertifikat wie verify-full;
#     selbst signiert: `?sslmode=no-verify`).
#
# Umgebung: DEPLOY_ENV (z. B. prod, staging; Standard prod) – je Stack verschieden setzen. `app` hängt im gemeinsamen
# `dokploy-network`; der Alias ep-intern-<DEPLOY_ENV>-app ist eindeutig (gleichnamige Dienste anderer Stacks).
#
# Ressourcen und Log-Rotation (Issue #39): Standardwerte für einen kleinen Server (ab 1 vCPU, 4 GB RAM), per
# *_MEM_LIMIT/*_CPUS überschreibbar. Images mit fester Version + Digest (Issue #74).

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: '10m'
      max-file: '5'

x-hardening: &hardening
  security_opt: ['no-new-privileges:true']
  init: true

services:
  app:
    <<: [*logging, *hardening]
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # z. B. postgres://atrium_prod:<passwort>@zentral-postgres-abc123:5432/atrium_prod
      #  oder postgres://atrium_prod:<passwort>@db.example.org:5432/atrium_prod?sslmode=require
      # Sonderzeichen im Passwort URL-kodieren (@ → %40, : → %3A, / → %2F …).
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL muss gesetzt sein (externes PostgreSQL)}
      APP_SECRET: ${APP_SECRET:?APP_SECRET muss gesetzt sein}
      ORIGIN: ${ORIGIN:?ORIGIN muss gesetzt sein (https://deine-domain)}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      # Verbindungen dieser App zur zentralen Datenbank; Summe aller Stacks < max_connections der Instanz
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      BACKUP_MAX_BYTES: ${BACKUP_MAX_BYTES:-}
      # Temp-Dateien der Datensicherung auf dem Volume `backup-tmp` statt im RAM-tmpfs /tmp (Issue #38)
      BACKUP_TMP_DIR: /var/tmp/ep-backup
      # Modul-Installation im Panel (Kalypzo Atrium): Supervisor baut im Container neu (Volume `atrium-data`).
      # `off` = nur Vorschau. Heap des Neubaus in MB (mem_limit entsprechend höher als im Normalbetrieb).
      ATRIUM_MODULE_INSTALL: ${ATRIUM_MODULE_INSTALL:-supervisor}
      ATRIUM_BUILD_HEAP: ${ATRIUM_BUILD_HEAP:-3072}
      # Frisches Deployment: Module, die der Server beim ersten Start selbst holt (JSON, siehe docs/deployment.md)
      ATRIUM_MODULES_SEED: ${ATRIUM_MODULES_SEED:-}
      # Traefik (Dokploy) setzt die Forwarded-Header
      ADDRESS_HEADER: X-Forwarded-For
      XFF_DEPTH: '1'
      PROTOCOL_HEADER: X-Forwarded-Proto
      HOST_HEADER: X-Forwarded-Host
      # Externer Storage (wird beim ersten Start in die Einstellungen übernommen; danach gilt Administration →
      # Einstellungen → Speicher). S3_ENDPOINT leer = AWS S3.
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:?S3_REGION muss gesetzt sein (z. B. fsn1, auto für R2, eu-central-1)}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET muss gesetzt sein}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID muss gesetzt sein}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY muss gesetzt sein}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      # Optional: Unterpfad im Bucket (z. B. atrium/prod), wenn sich mehrere Installationen einen Bucket teilen
      S3_PREFIX: ${S3_PREFIX:-}
      # E-Mail (optional; für Bestätigungs-Mails und Passwort-Reset)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    expose: ['3000']
    read_only: true
    volumes:
      - backup-tmp:/var/tmp/ep-backup
      - atrium-data:/data/atrium
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop: [ALL]
    networks:
      internal:
        aliases: ['ep-intern-${DEPLOY_ENV:-prod}-app']
      # Traefik + von Dokploy verwaltete (zentrale) Datenbank
      dokploy-network: {}
    # Neubau beim Installieren von Modulen braucht ~3 GB (Messwerte: docs/deployment.md)
    mem_limit: ${APP_MEM_LIMIT:-4g}
    cpus: ${APP_CPUS:-1.0}
    cpu_shares: 768
    pids_limit: 1024
    stop_grace_period: 45s

  # Optionale tägliche, verschlüsselte Sicherung (Issue #40), aktiv mit COMPOSE_PROFILES=backup.
  # Bei zentraler Datenbank meist überflüssig, wenn die Instanz selbst gesichert wird (Dokploy-Backups der verwalteten
  # Datenbank, pgBackRest o. ä.). Sonst: pg_dump dieser einen Datenbank über BACKUP_PG* plus Spiegel des Buckets.
  # pg_dump im Image ist Version 17 – die zentrale Instanz darf nicht neuer sein.
  db-backup:
    <<: [*logging, *hardening]
    profiles: ['backup']
    build:
      context: ./deploy/backup
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Berlin}
      # Zugang zur externen Datenbank (libpq-Variablen); Lesezugriff genügt. Kein `:?` – Compose wertet die Datei auch
      # ohne aktives Profil aus; fehlende Werte meldet backup.sh beim Lauf.
      PGHOST: ${BACKUP_PGHOST:-}
      PGPORT: ${BACKUP_PGPORT:-5432}
      PGUSER: ${BACKUP_PGUSER:-}
      PGPASSWORD: ${BACKUP_PGPASSWORD:-}
      PGDATABASE: ${BACKUP_PGDATABASE:-}
      PGSSLMODE: ${BACKUP_PGSSLMODE:-prefer}
      BACKUP_TIME: ${BACKUP_TIME:-02:30}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-7}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-4}
      BACKUP_KEEP_MONTHLY: ${BACKUP_KEEP_MONTHLY:-6}
      BACKUP_RUN_ON_START: ${BACKUP_RUN_ON_START:-false}
      BACKUP_HEARTBEAT_URL: ${BACKUP_HEARTBEAT_URL:-}
      BACKUP_NOTIFY_URL: ${BACKUP_NOTIFY_URL:-}
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-/backups/restic}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:-}
      BACKUP_REPO_ACCESS_KEY_ID: ${BACKUP_REPO_ACCESS_KEY_ID:-}
      BACKUP_REPO_SECRET_ACCESS_KEY: ${BACKUP_REPO_SECRET_ACCESS_KEY:-}
      BACKUP_REPO_REGION: ${BACKUP_REPO_REGION:-}
      # Quelle Objektspeicher: Standard = externer App-Bucket mit dem App-Zugang (Lesezugriff genügt)
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-${S3_ENDPOINT:-}}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-${S3_REGION:-us-east-1}}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-${S3_BUCKET:-}}
      BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-${S3_ACCESS_KEY_ID}}
      BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-${S3_SECRET_ACCESS_KEY}}
      BACKUP_S3_FORCE_PATH_STYLE: ${BACKUP_S3_FORCE_PATH_STYLE:-${S3_FORCE_PATH_STYLE:-false}}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-${S3_PREFIX:-}}
    volumes:
      - backup-work:/work
      - backup-repo:/backups
    networks: [internal, dokploy-network]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    mem_limit: ${BACKUP_MEM_LIMIT:-512m}
    cpus: ${BACKUP_CPUS:-0.5}
    cpu_shares: 256
    pids_limit: 256
    stop_grace_period: 60s

volumes:
  backup-tmp:
  atrium-data:
  backup-work:
  backup-repo:

networks:
  internal:
  # von Dokploy bereitgestelltes Netz (Traefik, von Dokploy verwaltete Datenbanken)
  dokploy-network:
    external: true
