<!doctype html>
<html
	lang="de"
	class="%app.theme%"
	data-density="%app.density%"
	data-app-theme="%app.apptheme%"
	style="%app.style%"
>
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script nonce="%sveltekit.nonce%">
			// Darstellung "system": dark-Klasse vor dem ersten Rendern setzen (kein Flackern)
			try {
				var t = /(?:^|; )theme=(light|dark|system)/.exec(document.cookie);
				if (
					(!t || t[1] === 'system') &&
					window.matchMedia('(prefers-color-scheme: dark)').matches
				) {
					document.documentElement.classList.add('dark');
				}
			} catch (e) {}
		</script>
		<link
			rel="icon"
			href="%sveltekit.assets%/icons/favicon-32.png"
			sizes="32x32"
			type="image/png"
		/>
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="EP Intern" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
